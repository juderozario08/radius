name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  hygiene:
    name: Code Hygiene & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for trailing whitespace
        run: git diff --check HEAD~1 2>/dev/null || git diff --check $(git hash-object -t tree /dev/null)

  backend:
    name: Go Backend Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: radius-backend/go.sum

      - name: Verify Backend Modules
        working-directory: radius-backend
        run: go mod verify

      - name: Run Go Vet
        working-directory: radius-backend
        run: go vet ./...

      - name: Run Go Tests & Migration Validation
        working-directory: radius-backend
        run: go test -v -count=1 ./...

  frontend:
    name: React Native Frontend Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: radius-frontend/package-lock.json

      - name: Install dependencies
        working-directory: radius-frontend
        run: npm ci

      - name: Typecheck
        working-directory: radius-frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: radius-frontend
        run: npm run lint

      - name: Unit Tests
        working-directory: radius-frontend
        run: npm test
