openapi: 3.0.3
info:
  title: Radius Retail ERP API
  version: 1.0.0
  description: API contracts for Radius Retail ERP Backend and Mobile Client.
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Server is working!

  /metrics:
    get:
      summary: Observability and cache metrics (JSON or Prometheus format)
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, prometheus]
      responses:
        '200':
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
            text/plain:
              schema:
                type: string

  /api/v1/metrics:
    get:
      summary: Versioned observability metrics endpoint
      responses:
        '200':
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'

  /login:
    post:
      summary: Employee authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
        '409':
          description: Conflict / already logged in elsewhere

  /api/refresh_token:
    post:
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  /api/logout:
    post:
      summary: Log out employee and terminate session
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session revoked successfully

  /api/verify_token:
    post:
      summary: Verify active session token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token is valid

  /api/admin/stores/operations:
    get:
      summary: Store operations summary dashboard
      security:
        - BearerAuth: []
      parameters:
        - name: store_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Aggregated operations summaries
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreOperationSummary'
        '304':
          description: Not modified

  /api/products:
    get:
      summary: Search and paginate catalog products
      security:
        - BearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: category_id
          in: query
          required: false
          schema:
            type: integer
        - name: brand
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated products list
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  total:
                    type: integer

  /api/products/{id}:
    get:
      summary: Get single product details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product details
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '304':
          description: Not modified

  /api/categories:
    get:
      summary: List all catalog categories
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Categories list
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        refresh_token:
          type: string
        employee_id:
          type: integer
        store_id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        email:
          type: string

    StoreOperationSummary:
      type: object
      properties:
        store_id:
          type: integer
        store_name:
          type: string
        city:
          type: string
        province:
          type: string
        is_active:
          type: boolean
        open_orders:
          type: integer
        pending_pos:
          type: integer
        active_cycle_counts:
          type: integer
        today_sales:
          type: number
        today_orders:
          type: integer

    Product:
      type: object
      properties:
        product_id:
          type: integer
        sku:
          type: string
        upc:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        category_id:
          type: integer
        brand:
          type: string
        unit_of_measure:
          type: string
        units_per_case:
          type: integer
        weight:
          type: number
        is_active:
          type: boolean
        is_returnable:
          type: boolean
        warranty_days:
          type: integer
        retail_price:
          type: number
        created_at:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        category_id:
          type: integer
        parent_id:
          type: integer
          nullable: true
        name:
          type: string

    MetricsResponse:
      type: object
      properties:
        redis:
          type: object
          properties:
            healthy:
              type: boolean
            message:
              type: string
            ping_latency_ms:
              type: integer
            avg_command_latency_ms:
              type: number
            hit_ratio:
              type: number
            metrics:
              type: object
        database_pool:
          type: object
          nullable: true
          properties:
            max_open_connections:
              type: integer
            open_connections:
              type: integer
            in_use:
              type: integer
            idle:
              type: integer
            wait_count:
              type: integer
            wait_duration_ms:
              type: integer
