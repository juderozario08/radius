name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  hygiene:
    name: Code Hygiene & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check for trailing whitespace
        run: git diff --check HEAD~1

  backend:
    name: Go Backend Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: radius-backend/go.mod
          cache-dependency-path: radius-backend/go.sum

      - name: Verify Backend Modules
        working-directory: radius-backend
        run: go mod verify

      - name: Check Go Formatting
        working-directory: radius-backend
        run: test -z "$(gofmt -l $(find . -name '*.go'))"

      - name: Run Go Vet
        working-directory: radius-backend
        run: go vet ./...

      - name: Run Go Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: radius-backend
          args: --default=none --enable govet --enable ineffassign ./...

      - name: Run Go Tests & Migration Validation
        working-directory: radius-backend
        run: go test -v -count=1 ./...

      - name: Scan Go Vulnerabilities
        working-directory: radius-backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build Production Image
        run: docker build ./radius-backend

  frontend:
    name: React Native Frontend Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: radius-frontend/package-lock.json

      - name: Install dependencies
        working-directory: radius-frontend
        run: npm ci

      - name: Typecheck
        working-directory: radius-frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: radius-frontend
        run: npm run lint

      - name: Unit Tests
        working-directory: radius-frontend
        run: npm test
