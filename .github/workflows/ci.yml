name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  hygiene:
    name: Code Hygiene & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check for trailing whitespace
        run: git diff --check HEAD~1

  backend:
    name: Go Backend Test & Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: radius_ci
          POSTGRES_USER: radius_ci
          POSTGRES_PASSWORD: radius_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radius_ci -d radius_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://radius_ci:radius_ci@localhost:5432/radius_ci?sslmode=disable
      RADIUS_TEST_DATABASE_URL: postgres://radius_ci:radius_ci@localhost:5432/radius_ci?sslmode=disable
      GIN_MODE: release
      JWT_SECRET_KEY: radius-ci-secret-key-32-bytes-long-for-tests
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: radius-backend/go.mod
          cache-dependency-path: radius-backend/go.sum

      - name: Verify Backend Modules
        working-directory: radius-backend
        run: go mod verify

      - name: Check Go Formatting
        working-directory: radius-backend
        run: test -z "$(gofmt -l $(find . -name '*.go'))"

      - name: Run Go Vet
        working-directory: radius-backend
        run: go vet ./...

      - name: Run Go Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: radius-backend
          args: --default=none --enable govet --enable ineffassign ./...

      - name: Apply and verify migrations
        working-directory: radius-backend
        run: |
          go run ./cmd/migrate
          go run -tags 'postgres file' github.com/golang-migrate/migrate/v4/cmd/migrate -path migrations -database "$DATABASE_URL" down 1
          go run -tags 'postgres file' github.com/golang-migrate/migrate/v4/cmd/migrate -path migrations -database "$DATABASE_URL" up 1

      - name: Run Go Tests & Migration Validation
        working-directory: radius-backend
        run: go test -v -count=1 ./...

      - name: Scan Go Vulnerabilities
        working-directory: radius-backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build Production Image
        run: docker build ./radius-backend

  frontend:
    name: React Native Frontend Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: radius-frontend/package-lock.json

      - name: Install dependencies
        working-directory: radius-frontend
        run: npm ci

      - name: Typecheck
        working-directory: radius-frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: radius-frontend
        run: npm run lint

      - name: Unit Tests
        working-directory: radius-frontend
        run: npm test
